    <style>

margin: auto;
     padding: .8in .8in .8in .8in;
        }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
        .chart-container { background: #fff; padding: 15px; border: 1px solid #e1e8ed; border-radius: 6px; min-height: 300px; display: flex; flex-direction: column; justify-content: center; }
        .chart-title { font-weight: bold; text-align: center; margin-bottom: 10px; color: #666; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 2px 3px rgba(0,0,0,0.05); }
        th { padding: 12px 15px; text-align: center; border-bottom: 1px solid #e0e0e0; }
       td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th { background-color: #34495e; color: white; font-weight: 600; }
        tr:hover { background-color: #f1f2f6; }
        .text-right { text-align: right; }

/* High-fidelity PDF rendering engine fallback */

        .bar-lbl { width: 130px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bar-bg { flex-grow: 1; background: #eee; height: 20px; border-radius: 3px; position: relative; margin: 0 10px; }
        .bar-fill { height: 100%; background: rgba(52, 152, 219, 0.8); border: none; border-radius: 3px; box-shadow: inset 0 0 0 2px rgba(52, 152, 219, .5)}
        .donut-svg { width: 100%; height: 220px; transform: rotate(-90deg); }
        .donut-segment { fill: none; stroke-width: 3.8; }
        .legend-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; font-size: 12px; }

<body>

<div class="container">
    <h1>Executive Sales Report</h1>
    <p>Generated dynamically from C Backend inventory data.</p>

    <!-- Visual Charts Section -->
    <h2>Performance Analytics</h2>
    <div class="dashboard-grid">
        <div class="chart-container" id="revenueChartContainer">
            <div class="chart-title">Revenue Contribution by Product</div>
            <!-- Dynamic Vector Bar Chart rendered here -->
        </div>
        <div class="chart-container" id="quantityChartContainer">
            <div class="chart-title">Volume Sold Share</div>
            <!-- Dynamic Vector Doughnut Chart rendered here -->
        </div>
    </div>
<br><br><br><br>
    <!-- Data Table Section -->
    <h2>Product Breakdown</h2>
    <table>
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Price (LKR)</th>
                <th>Quantity Sold</th>
                <th>Total Revenue (LKR)</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Data injected here by C/JS -->
        </tbody>
      </table>
</div>

<script>
    // 1. Data Object (C updates this)
    const salesData = [
		{ id: "0101", name: "Chicken Rice", price: 450.00, qty: 9, revenue: 4050.00 },
		{ id: "0103", name: "Vegetable Rice", price: 180.00, qty: 7, revenue: 1260.00 },
		{ id: "0107", name: "Noodles", price: 100.00, qty: 4, revenue: 400.00 },
		{ id: "0202", name: "Vegetable Roti", price: 80.00, qty: 3, revenue: 240.00 },
		{ id: "0108", name: "Pasta", price: 180.00, qty: 5, revenue: 900.00 },
		{ id: "0204", name: "Samosa", price: 80.00, qty: 5, revenue: 400.00 },
];

    // 2. Populate the HTML Table dynamically
    const tableBody = document.getElementById('table-body');
    salesData.forEach(item => {
        let row = `<tr>
            <td>${item.id}</td>
            <td>${item.name}</td>
            <td style="text-align: right;">${item.price.toFixed(2)}</td>
            <td style="text-align:center;">${item.qty}</td>
            <td class="text-right">${item.revenue.toFixed(2)}</td>
        </tr>`;
        tableBody.innerHTML += row;
    });

    // 3. Append total row
    const tfoot = document.createElement('tfoot');
       tfoot.innerHTML = `<tr style="border: 1px solid black;"><td colspan = '4' class="text-right"><strong>Total (LKR) :</strong></td><td  style="border: 1px solid black;" class="text-right">${salesData.reduce((sum, item) => sum + item.revenue, 0).toFixed(2)}</td></tr>`;
      document.querySelector('table').appendChild(tfoot);

       // 3. Render High-Fidelity Revenue Bar Chart (Zero-dependency & Animation-free for instant headless hook printing)
    const revContainer = document.getElementById('revenueChartContainer');
    const maxRevenue = Math.max(...salesData.map(item => item.revenue));

        salesData.forEach(item => {
        const pct = (item.revenue / maxRevenue) * 100;
        const barRow = `
            <div class="bar-chart-track">
                <div class="bar-lbl" title="${item.name}">${item.name}</div>
                <div class="bar-bg">
                    <div class="bar-fill" style="width: ${pct}%;"></div>
                </div>
                <div style="font-size: 12px; font-weight: 600; width: 65px; text-align: right;">${item.revenue.toFixed(0)}</div>
            </div>`;
        revContainer.innerHTML += barRow;
    });

    // 4. Render High-Fidelity Vector Doughnut Chart
    const qtyContainer = document.getElementById('quantityChartContainer');
    const totalQty = salesData.reduce((sum, item) => sum + item.qty, 0);
    const colors = ['#2ecc71', '#e74c3c', '#f1c40f', '#9b59b6', '#3498db', '#1abc9c', '#16a085', '#27ae60', '#2980b9', '#8e44ad', '#34495e', '#2c3e50', '#f39c12', '#e67e22', '#d35400', '#c0392b', '#ecf0f1', '#bdc3c7', '#95a5a6', '#7f8c8d', '#1abc9c', '#16a085', '#2ecc71', '#27ae60', '#3498db', '#2980b9', '#9b59b6', '#8e44ad', '#34495e', '#2c3e50'   ];

    let svgContent = `<svg class="donut-svg" viewBox="0 0 42 42">
        <circle cx="21" cy="21" r="15.91549430918954" fill="#fff"></circle>`;

    let currentOffset = 0;
    salesData.forEach((item, index) => {
        const pct = (item.qty / totalQty) * 100;
        const color = colors[index % colors.length];
        svgContent += `<circle class="donut-segment" cx="21" cy="21" r="15.91549430918954" 
            stroke="${color}" stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="${100 - currentOffset}"></circle>`;
        currentOffset += pct;
    });

    svgContent += `</svg><div class="legend-list">`;
    salesData.forEach((item, index) => {
        const color = colors[index % colors.length];
        svgContent += `
            <div class="legend-item">
                <div class="legend-color" style="background-color: ${color};"></div>
                <span>${item.name} (${item.qty})</span>
            </div>`;
    });
    svgContent += `</div>`;
    qtyContainer.innerHTML += svgContent;

    // 5. Execution Milestone Handshake
    // Your headless C routine detects this print state string via console callbacks to initiate immediate PDF layout printing.
    console.log("REPORT_GENERATION_COMPLETE");
</script>

</body>
